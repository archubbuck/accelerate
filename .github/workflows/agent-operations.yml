name: Agent Operations
on:
  push:
    paths:
      - 'tools/operations/**'
      - 'packages/tooling-*/**'
      - 'tools/registry/operation-*.test.mjs'
      - 'packages/feature-flags-core/operations/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/agent-operations.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter '@accelerate/tooling-*' run typecheck
      - run: pnpm --filter '@accelerate/tooling-*' run build
      - run: node --test tools/registry/operation-*.test.mjs
