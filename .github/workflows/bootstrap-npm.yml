name: Bootstrap npm packages (one-time token)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BOOTSTRAP to publish missing @accelerate packages with NPM_TOKEN'
        required: true
        type: string
concurrency:
  group: accelerate-npm-release
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate bootstrap confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != BOOTSTRAP ]; then
            echo '::error::Enter BOOTSTRAP exactly in the confirmation field.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --no-frozen-lockfile
      - name: Validate package registry
        run: |
          node tools/registry/cli.mjs sync --check
          node tools/registry/cli.mjs validate
          node tools/registry/cli.mjs docs --check
          node --test tools/registry/*.test.mjs
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Audit package artifacts
        run: pnpm registry:audit
      - name: Verify package archives
        run: node tools/registry/release.mjs pack
      - name: Publish missing package versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN missing"; exit 1; }
          node tools/registry/release.mjs publish
