name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Audit package artifacts
        run: pnpm registry:audit
      - name: Verify all npm package archives
        run: node tools/registry/release.mjs pack
      - name: Verify consolidated npm packages in a clean consumer
        run: node tools/registry/consolidation-consumer.mjs
      - name: Angular consumer production build
        run: pnpm --filter @accelerate/authorization-angular test:consumer

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authorization
          POSTGRES_PASSWORD: authorization_test
          POSTGRES_DB: authorization_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authorization -d authorization_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHORIZATION_TEST_DATABASE_URL: postgresql://authorization:authorization_test@localhost:5432/authorization_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @accelerate/authorization-core build
      - run: pnpm --filter @accelerate/authorization-postgres test
      - name: Build Wave 7 integration dependencies
        run: pnpm --filter @accelerate/transactions --filter @accelerate/data-postgres... --filter @accelerate/migrations-postgres... --filter @accelerate/locking-postgres... --filter @accelerate/idempotency-postgres... --filter @accelerate/outbox-postgres... build
      - name: Verify Wave 7 PostgreSQL contracts
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: pnpm --filter @accelerate/data-postgres --filter @accelerate/decimal-core --filter @accelerate/migrations-postgres --filter @accelerate/locking-postgres --filter @accelerate/idempotency-postgres --filter @accelerate/outbox-postgres test
      - name: Verify OAuth transaction and identity link contention
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: pnpm --filter @accelerate/authentication-postgres test
      - name: Verify service principal credentials on PostgreSQL
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: |
          pnpm --filter @accelerate/api-keys... build
          pnpm --filter @accelerate/api-keys test
      - name: Verify concurrent audit writes and integrity checks
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: pnpm --filter @accelerate/audit-postgres test
      - name: Verify distributed AI budget reservations
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: |
          pnpm --filter @accelerate/ai-usage... build
          pnpm --filter @accelerate/ai-usage test
      - name: Verify persisted agent recovery on PostgreSQL
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: |
          pnpm --filter @accelerate/agents-core... build
          pnpm --filter @accelerate/agents-core test
      - name: Verify durable event subscriptions on PostgreSQL and Redis
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
          EVENT_JOURNAL_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          pnpm --filter @accelerate/events-postgres... --filter @accelerate/events-redis... build
          pnpm --filter @accelerate/events-postgres --filter @accelerate/events-redis test
      - name: Verify durable workflow recovery on PostgreSQL
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: |
          pnpm --filter @accelerate/workflows-postgres... build
          pnpm --filter @accelerate/workflows-postgres test
      - name: Verify distributed scheduling on PostgreSQL
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: |
          pnpm --filter @accelerate/scheduler-postgres... build
          pnpm --filter @accelerate/scheduler-postgres test
      - name: Verify PostgreSQL and Redis quota contention
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
          RATE_LIMIT_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          pnpm --filter @accelerate/rate-limit-postgres... --filter @accelerate/rate-limit-redis... build
          pnpm --filter @accelerate/rate-limit-postgres --filter @accelerate/rate-limit-redis test
