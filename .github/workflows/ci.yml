name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Audit package artifacts
        run: pnpm registry:audit
      - name: Verify all npm package archives
        run: node tools/registry/release.mjs pack
      - name: Angular consumer production build
        run: pnpm --filter @accelerate/authorization-angular test:consumer

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authorization
          POSTGRES_PASSWORD: authorization_test
          POSTGRES_DB: authorization_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authorization -d authorization_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHORIZATION_TEST_DATABASE_URL: postgresql://authorization:authorization_test@localhost:5432/authorization_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @accelerate/authorization-core build
      - run: pnpm --filter @accelerate/authorization-postgres test
      - name: Build Wave 7 integration dependencies
        run: pnpm --filter @accelerate/data-postgres... --filter @accelerate/migrations-postgres... --filter @accelerate/locking-postgres... --filter @accelerate/idempotency-postgres... build
      - name: Verify Wave 7 PostgreSQL contracts
        env:
          WAVE7_TEST_DATABASE_URL: ${{ env.AUTHORIZATION_TEST_DATABASE_URL }}
        run: pnpm --filter @accelerate/decimal-core --filter @accelerate/migrations-postgres --filter @accelerate/locking-postgres --filter @accelerate/idempotency-postgres test
