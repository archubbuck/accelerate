name: Package registry
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @accelerate/feature-flags-core build
      - run: node --test tools/registry/*.test.mjs
      - run: node tools/registry/cli.mjs sync --check
      - run: node tools/registry/cli.mjs validate
      - run: node tools/registry/cli.mjs docs --check
