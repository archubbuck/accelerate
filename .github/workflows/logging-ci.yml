name: Logging package CI
on:
  push:
    paths:
      - 'packages/logging-*/**'
      - '.npmrc'
      - 'docs/logging.md'
      - '.github/workflows/logging-ci.yml'
  pull_request:
    paths:
      - 'packages/logging-*/**'
      - '.github/workflows/logging-ci.yml'
      - '.npmrc'
  workflow_dispatch:
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify npm tarballs
        run: |
          for pkg in packages/logging-*; do
            if [ "$pkg" = "packages/logging-angular" ]; then
              (cd "$pkg/dist" && npm pack --dry-run)
            else
              (cd "$pkg" && npm pack --dry-run)
            fi
          done
