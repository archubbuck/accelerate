name: Publish npm packages
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm CLI
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Verify publish contents
        run: |
          for pkg in packages/*; do
            (cd "$pkg" && npm pack --dry-run)
          done
      - name: Publish with npm trusted publishing (OIDC)
        run: |
          set -e
          for pkg in authorization-core authorization-angular authorization-react authorization-postgres; do
            (cd "packages/$pkg" && npm publish --access public)
          done
