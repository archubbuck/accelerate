name: Publish npm packages
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authorization
          POSTGRES_PASSWORD: authorization_test
          POSTGRES_DB: authorization_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authorization -d authorization_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHORIZATION_TEST_DATABASE_URL: postgresql://authorization:authorization_test@localhost:5432/authorization_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm CLI
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Angular consumer production build
        run: pnpm --filter @accelerate/authorization-angular test:consumer
      - name: Verify publish contents
        run: |
          for pkg in packages/*; do
            if [ "$pkg" = "packages/authorization-angular" ]; then
              (cd "$pkg/dist" && npm pack --dry-run)
            else
              (cd "$pkg" && npm pack --dry-run)
            fi
          done < <(node "$GITHUB_WORKSPACE/tools/registry/cli.mjs" publish-order)
      - name: Publish unpublished package versions with npm OIDC
        run: |
          set -euo pipefail

          while IFS= read -r pkg; do
            if [ "$pkg" = "authorization-angular" ] || [ "$pkg" = "logging-angular" ]; then
              cd "$GITHUB_WORKSPACE/packages/$pkg/dist"
            else
              cd "$GITHUB_WORKSPACE/packages/$pkg"
            fi

            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")

            if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Already published: $name@$version"
            else
              echo "Publishing: $name@$version"
              npm publish --access public
            fi
          done
