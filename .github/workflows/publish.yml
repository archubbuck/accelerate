name: Publish npm packages
on:
  workflow_dispatch:
concurrency:
  group: accelerate-npm-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authorization
          POSTGRES_PASSWORD: authorization_test
          POSTGRES_DB: authorization_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authorization -d authorization_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHORIZATION_TEST_DATABASE_URL: postgresql://authorization:authorization_test@localhost:5432/authorization_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install supported npm CLI
        run: npm install --global npm@^11.15.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate package registry
        run: |
          node tools/registry/cli.mjs sync --check
          node tools/registry/cli.mjs validate
          node tools/registry/cli.mjs docs --check
      - name: Build
        run: pnpm build
      - name: Test registry and packaged operations
        run: pnpm registry:test
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Angular consumer production build
        run: pnpm --filter @accelerate/authorization-angular test:consumer
      - name: Audit package artifacts
        run: pnpm registry:audit
      - name: Verify package archives
        run: node tools/registry/release.mjs pack
      - name: Publish missing package versions
        run: node tools/registry/release.mjs publish
